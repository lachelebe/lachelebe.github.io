<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danke | lache&lebe</title>
  <meta name="description" content="Danke – deine Anmeldung ist bestätigt. Meditation & Bewusstsein mit Andrea Hopf.">

  <style>
    :root{
      --bg-page:#f4f1ea; --bg-card-top:#e7f0ea; --bg-card-bottom:#ffffff;
      --accent:#7aa899; --accent-dark:#5f8b7c; --text-main:#25313a; --text-muted:#6b7280;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg-page);color:var(--text-main);line-height:1.6}
    .page{max-width:860px;margin:0 auto;padding:32px 16px 40px}
    .card{border-radius:28px;overflow:hidden;box-shadow:0 18px 45px rgba(148,163,184,.6);border:1px solid #e5e7eb;
      background:linear-gradient(to bottom,var(--bg-card-top) 0 55%,var(--bg-card-bottom) 55% 100%)}
    .card-inner{padding:50px 26px 38px;text-align:center}
    @media (max-width:640px){.card-inner{padding:40px 18px 32px}}
    .brand{font-size:1.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
    .subbrand{margin-top:4px;font-size:1.05rem;color:var(--accent-dark);letter-spacing:.08em;text-transform:uppercase}
    .headline{margin-top:26px;font-size:1.4rem;font-weight:600}
    .text-block{margin-top:16px;font-size:.97rem;color:var(--text-muted);line-height:1.7;max-width:620px;margin-left:auto;margin-right:auto}
    .text-block p+p{margin-top:.6rem}
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="card-inner">
        <div class="brand">LACHE&LEBE</div>
        <div class="subbrand">MEDITATION &amp; BEWUSSTSEIN</div>

        <div class="headline">Danke – du bist bestätigt 🌸</div>

        <div class="text-block">
          <p>Deine Anmeldung wurde erfolgreich bestätigt.</p>
          <p>Du bekommst gleich die nächsten Infos per E-Mail – schau bitte auch in Spam/Werbung, falls du nichts siehst.</p>
          <p>Ich freue mich, dass du da bist. 💫</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
